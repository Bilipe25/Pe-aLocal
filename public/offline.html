<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D9480F" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Você está offline | PedidoLocal</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #fffdf9;
        color: #241c15;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        background: #fffdf9;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      section {
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: #fde8dc;
        color: #d9480f;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 7vw, 2.25rem);
        line-height: 1.15;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0.75rem 0 0;
        color: #6b625a;
        font-size: 1rem;
        line-height: 1.75;
      }
      form {
        margin-top: 2rem;
      }
      button {
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        background: #c2410c;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 4px solid rgb(245 158 11 / 40%);
        outline-offset: 2px;
      }
      .privacy {
        margin-top: 1.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="offline-title">
        <div class="icon" aria-hidden="true">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m2 2 20 20"></path>
            <path d="M8.5 8.5A7 7 0 0 1 19 10"></path>
            <path d="M5 12.6a10 10 0 0 1 .9-.7"></path>
            <path d="M12.6 18.5a1 1 0 1 1-1.2 0"></path>
            <path d="M8.5 15.5a5 5 0 0 1 1.5-.9"></path>
          </svg>
        </div>
        <h1 id="offline-title">Você está offline</h1>
        <p>Não conseguimos carregar esta página agora. Confira sua conexão e tente novamente.</p>
        <form method="get" action="">
          <button type="submit">Tentar novamente</button>
        </form>
        <p class="privacy">Seus dados não são enviados enquanto não houver conexão.</p>
      </section>
    </main>
  </body>
</html>
