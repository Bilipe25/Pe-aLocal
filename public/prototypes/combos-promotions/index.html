<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PedidoLocal — Protótipo de Combos e Promoções</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      THESIS: Uma oferta deve parecer parte natural do cardápio, não uma campanha de marketing.
      OWN-WORLD: PedidoLocal/Papel/Tinta/Pimenta/Kraft, operação direta e comércio de bairro.
      STORY: encontrar ofertas -> compor uma oferta -> conferir economia -> publicar/comprar.
      FIRST VIEWPORT: uma decisão principal, uma lista curta e nenhuma métrica decorativa.
      FORM: superfícies planas, divisórias firmes, fotografia quente e preço em mono.
      FINISH: estados ativos explícitos, economia verificável e ações alcançáveis por toque.
    -->

    <svg class="symbol-library" aria-hidden="true">
      <symbol id="i-bag" viewBox="0 0 24 24">
        <path d="M6 8h12l1 12H5L6 8Z" />
        <path d="M9 9V6a3 3 0 0 1 6 0v3" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6" rx="1" />
        <rect x="14" y="4" width="6" height="6" rx="1" />
        <rect x="4" y="14" width="6" height="6" rx="1" />
        <rect x="14" y="14" width="6" height="6" rx="1" />
      </symbol>
      <symbol id="i-orders" viewBox="0 0 24 24">
        <path d="M7 4h10v16H7z" />
        <path d="M9 8h6M9 12h6M9 16h4" />
      </symbol>
      <symbol id="i-kitchen" viewBox="0 0 24 24">
        <path d="M5 4v7a3 3 0 0 0 3 3h1V4M7 4v6M16 4v16M19 4v7a3 3 0 0 1-3 3" />
      </symbol>
      <symbol id="i-store" viewBox="0 0 24 24">
        <path d="M4 10h16l-2-6H6l-2 6Z" />
        <path d="M5 10v10h14V10M9 20v-6h6v6" />
      </symbol>
      <symbol id="i-tag" viewBox="0 0 24 24">
        <path d="m4 13 9-9h7v7l-9 9-7-7Z" />
        <circle cx="16.5" cy="7.5" r="1" />
      </symbol>
      <symbol id="i-coupon" viewBox="0 0 24 24">
        <path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4V7Z" />
        <path d="M9 9v6M15 9v6" />
      </symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V9M12 20V4M19 20v-7" /></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24">
        <path d="M3 6h11v11H3zM14 10h4l3 3v4h-7" />
        <circle cx="7" cy="18" r="2" />
        <circle cx="18" cy="18" r="2" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-cart" viewBox="0 0 24 24">
        <path d="M4 5h2l2 10h9l2-7H7" />
        <circle cx="10" cy="19" r="1.5" />
        <circle cx="17" cy="19" r="1.5" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m16 16 4 4" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
    </svg>

    <main id="prototype" aria-live="polite"></main>
    <script src="./app.js"></script>
  </body>
</html>
